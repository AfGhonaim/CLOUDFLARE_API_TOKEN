name: verify

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build dashboard and validate company data
        run: node scripts/build-dashboard.mjs
      - name: Check every concept carries its disclaimer
        run: node scripts/check-concepts.mjs
