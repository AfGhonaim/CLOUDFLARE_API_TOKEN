name: verify

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium

      - name: Build dashboard and validate company data
        run: node scripts/build-dashboard.mjs

      - name: Check disclaimers, CTA scope, and source exposure
        run: node scripts/check-concepts.mjs

      - name: Render every concept at 360/768/1440
        run: node scripts/smoke.mjs

  whatsapp-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the bot's dependencies
        working-directory: worker
        run: npm ci

      - name: Test signature verification, parsing, chunking, and routing
        working-directory: worker
        run: npm test

      - name: Check the Worker still bundles
        working-directory: worker
        run: npx wrangler deploy --dry-run --outdir=/tmp/worker-build
